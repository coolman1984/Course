name: Check academy changes
on:
  pull_request:
    branches: [main]
    paths:
      - "academy/**"
      - ".github/workflows/academy-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check academy/src/data/stories.js
          node --check academy/src/data/plain-talk-a.js
          node --check academy/src/data/plain-talk-b.js
          node --check academy/src/data/situations.js
          node --check academy/src/engine/render.js
          node --check academy/src/engine/motion.js
          node --check academy/build.mjs
          test -s academy/src/motion.css
      - name: Verify book mapping and all 41 new stories
        run: node --test academy/test/data.test.mjs
      - name: Build complete offline academy
        run: node academy/build.mjs
      - name: Verify start-with-AI page in offline build
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("AI_Academy.html","utf8"); for(const s of ["البداية مع الذكاء الاصطناعي","execCommand","copySituationPrompt"])if(!html.includes(s))throw Error("Missing start-ai marker: "+s); console.log("Start-with-AI page bundled");'
      - name: Verify the new visual lesson introduction exists
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("AI_Academy.html","utf8"); for(const s of ["تخيّل الموقف ده","ابدأ بالمشكلة، مش بالمصطلح","من المشكلة للنتيجة"])if(!html.includes(s))throw Error("Missing visual introduction: "+s); console.log("All visual intro markers present");'
      - name: Check all 41 lessons use the plain Arabic teaching layer
        run: |
          node -e 'const fs=require("node:fs");const html=fs.readFileSync("AI_Academy.html","utf8");for(const key of ["plain-talk-a.js","plain-talk-b.js","plain-copy","orig-layer"])if(!html.includes(key))throw Error("Missing teaching layer: "+key);console.log("All 41 lessons use the plain-language layer");'
      - name: Ensure educational motion is bundled and independent of networks
        run: |
          node -e 'const f=require("node:fs");const h=f.readFileSync("AI_Academy.html","utf8");for(const word of ["motion-theatre","data-motion-stage","t-page-slide","prefers-reduced-motion","transitions.dev"]) if(!h.includes(word))throw Error("Missing motion pattern: "+word); if(h.includes("__FONT:"))throw Error("Uninlined local font asset"); console.log("Offline educational motion and fonts bundled")'
      - name: Install browser for full academy tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test every route, interaction, Arabic and English, mobile and offline
        run: node academy/test/e2e.mjs
