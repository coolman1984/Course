name: Check academy changes
on:
  pull_request:
    branches: [main]
    paths:
      - "academy/**"
      - ".github/workflows/academy-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check academy/src/data/stories.js
          node --check academy/src/data/plain-talk-a.js
          node --check academy/src/data/plain-talk-b.js
          node --check academy/src/engine/render.js
          node --check academy/src/engine/motion.js
          node --check academy/src/data/history.js
          node --check academy/src/data/window-story.js
          node --check academy/src/data/agents-story.js
          node --check academy/src/data/work-story.js
          node --check academy/src/data/limits-story.js
          node --check academy/src/data/auto-story.js
          node --check academy/src/data/big-story.js
          node --check academy/src/data/kit-story.js
          node --check academy/src/data/deliver-story.js
          node --check academy/src/data/stack-story.js
          node --check academy/src/data/lookup-story.js
          node --check academy/src/data/report-story.js
          node --check academy/src/data/run-story.js
          node --check academy/src/data/xl-sample.js
          node --check academy/src/data/lessons-xl.js
          node --check academy/src/engine/xlkit.js
          node --check academy/src/engine/labs.js
          node --check academy/src/data/course-order.js
          node --check academy/src/engine/history.js
          node --check academy/src/data/model-story.js
          test -s academy/src/history.css
          node --check academy/build.mjs
          test -s academy/src/motion.css
      - name: Verify book mapping and all 41 new stories
        run: node --test academy/test/data.test.mjs
      - name: Build complete offline academy
        run: node academy/build.mjs
      - name: Verify the AI guide sits at the top of the offline build
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("AI_Academy.html","utf8"); const i=html.indexOf("id=\"ai-guide\""); if(i<0||i>2000)throw Error("AI guide missing or not at the top: "+i); console.log("AI guide at char "+i);'
      - name: Verify the removed lesson situation section stays out
        run: |
          node -e 'const fs=require("node:fs"); const html=fs.readFileSync("AI_Academy.html","utf8"); for(const s of ["تخيّل الموقف ده","sec-mental"])if(html.includes(s))throw Error("Removed section is back: "+s); console.log("Lesson situation section removed");'
      - name: Check all 41 lessons use the plain Arabic teaching layer
        run: |
          node -e 'const fs=require("node:fs");const html=fs.readFileSync("AI_Academy.html","utf8");for(const key of ["plain-talk-a.js","plain-talk-b.js","plain-copy","orig-layer"])if(!html.includes(key))throw Error("Missing teaching layer: "+key);console.log("All 41 lessons use the plain-language layer");'
      - name: Ensure educational motion is bundled and independent of networks
        run: |
          node -e 'const f=require("node:fs");const h=f.readFileSync("AI_Academy.html","utf8");for(const word of ["prefers-reduced-motion","transitions.dev"]) if(!h.includes(word))throw Error("Missing motion pattern: "+word); for(const word of ["motion-theatre","data-motion-stage","t-page-slide"]) if(h.includes(word))throw Error("Removed home theatre is back: "+word); if(h.includes("__FONT:"))throw Error("Uninlined local font asset"); console.log("Offline educational motion and fonts bundled")'
      - name: Install browser for full academy tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test every route, interaction, Arabic and English, mobile and offline
        run: node academy/test/e2e.mjs
      - name: Every drawing label inside its frame, Arabic and English
        run: node academy/test/art-check.mjs
