# Publishes the interactive academy to GitHub Pages.
# Every push to main that touches the academy or the book rebuilds the page from academy/src and redeploys it.
name: Publish academy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "academy/**"
      - "AI_Essentials_Course_For_Modern_Workspace.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check book data
        run: node --test academy/test/data.test.mjs
      - name: Build the single-file academy
        run: node academy/build.mjs
      - name: Refresh downloadable offline HTML in the repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Academy.html
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh standalone offline academy [skip ci]"
            git push || echo "::warning::Standalone HTML could not be pushed; published Pages build is still current."
          fi
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp AI_Academy.html _site/index.html
          cp AI_Essentials_Course_For_Modern_Workspace.pdf _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
